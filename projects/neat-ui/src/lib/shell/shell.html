@if (kiosk.active()) {
  <!-- First in the tab order, so it is reachable from the keyboard. -->
  <neat-kiosk-exit />
} @else {
  <div class="rail" [attr.data-expanded]="railExpanded()">
    <nav aria-label="Main">
      <ul class="rail-list">
        @for (item of navItems(); track item.path) {
          <li>
            <a
              class="rail-item"
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="activeMatch"
              ariaCurrentWhenActive="page"
              [neatTooltip]="item.label"
              neatTooltipPosition="right"
              [neatTooltipDisabled]="railExpanded()"
            >
              <neat-icon [name]="item.icon" />
              <span class="label" [class.visually-hidden]="!railExpanded()">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <button
      type="button"
      class="rail-item rail-toggle"
      aria-label="Show labels"
      [attr.aria-pressed]="railExpanded()"
      neatTooltip="Show labels"
      neatTooltipPosition="right"
      [neatTooltipDisabled]="railExpanded()"
      (click)="toggleRail()"
    >
      <neat-icon [name]="railExpanded() ? 'rail-collapse' : 'rail-expand'" />
    </button>
  </div>

  <header class="topbar">
    <div class="brand">
      <neat-logo />
      <span class="app-name">{{ appName() }}</span>
    </div>
    @if (pageTitle(); as title) {
      <h1 class="page-title">{{ title }}</h1>
    }
    <div class="topbar-end">
      <ng-content select="[neatTopbarEnd]" />
    </div>
    <div class="topbar-actions">
      <button
        neatButton
        type="button"
        variant="text"
        size="large"
        rounded
        iconOnly
        aria-label="Dark mode"
        [attr.aria-pressed]="theme.scheme() === 'dark'"
        neatTooltip="Dark mode"
        neatTooltipPosition="bottom"
        (click)="theme.toggle()"
      >
        <neat-icon [name]="theme.scheme() === 'dark' ? 'sun' : 'moon'" />
      </button>
      <button
        neatButton
        type="button"
        variant="text"
        size="large"
        rounded
        iconOnly
        aria-label="Kiosk mode"
        [attr.aria-pressed]="kiosk.active()"
        neatTooltip="Kiosk mode"
        neatTooltipPosition="bottom"
        (click)="kiosk.toggle()"
      >
        <neat-icon name="kiosk-enter" />
      </button>
    </div>
  </header>
}

<main class="content">
  <ng-content />
</main>
