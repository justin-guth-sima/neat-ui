@if (kiosk.active()) {
  <div class="kiosk-chrome" [attr.data-shown]="!kiosk.pointerIdle()">
    <!-- First in the tab order, so it is reachable from the keyboard; drawn last (right). -->
    <neat-kiosk-exit (exited)="focusKioskButtonAfterExit()" />
    @if (pageToolbar() || asideToggle()) {
      <div class="kiosk-toolbar shadow-md" role="group" [attr.aria-label]="toolbarLabel">
        <ng-template [cdkPortalOutlet]="pageToolbar()" />
        <ng-template [cdkPortalOutlet]="asideToggle()" />
      </div>
    }
  </div>
} @else {
  <div
    class="rail data-[floating=true]:shadow-md"
    [attr.data-expanded]="railExpanded()"
    [attr.data-floating]="viewport.narrow() && railExpanded()"
  >
    <nav aria-label="Main">
      <ul class="rail-list">
        @for (item of navItems(); track item.path) {
          <li>
            <a
              neatRailItem
              [label]="item.label"
              [routerLink]="item.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="activeMatch"
              ariaCurrentWhenActive="page"
            >
              <neat-icon [name]="item.icon" />
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- The app's items, then the kit's theme item: after the pages in the tab order. -->
    <div class="rail-end">
      <hr neatRailDivider />
      <ng-content select="[neatRailEnd]" />
      <button
        neatRailItem
        type="button"
        [label]="theme.scheme() === 'dark' ? 'Light theme' : 'Dark theme'"
        (click)="theme.toggle()"
      >
        <neat-icon [name]="theme.scheme() === 'dark' ? 'sun' : 'moon'" />
      </button>
    </div>

    <button
      neatRailItem
      type="button"
      [label]="railExpanded() ? 'Collapse' : 'Show labels'"
      (click)="toggleRail()"
    >
      <neat-icon [name]="railExpanded() ? 'rail-collapse' : 'rail-expand'" />
    </button>
  </div>

  <header class="topbar" [attr.data-toolbar]="pageToolbar() ? 'true' : 'false'">
    <div class="brand">
      <neat-logo />
      <span class="app-name" [class.sr-only]="viewport.narrow()">{{ appName() }}</span>
    </div>
    @if (pageTitle(); as title) {
      <h1 class="page-title" [class.sr-only]="viewport.narrow()">{{ title }}</h1>
    }
    @if (pageToolbar(); as toolbar) {
      <div class="page-toolbar" role="group" [attr.aria-label]="toolbarLabel">
        <ng-template [cdkPortalOutlet]="toolbar" />
      </div>
    }
    <div class="topbar-end">
      <ng-content select="[neatTopbarEnd]" />
    </div>
    <div class="topbar-actions">
      <button
        #kioskButton
        neatButton
        type="button"
        variant="text"
        size="large"
        rounded
        iconOnly
        aria-label="Kiosk mode"
        neatTooltip="Kiosk mode"
        neatTooltipPosition="bottom"
        (click)="kiosk.toggle()"
      >
        <neat-icon name="kiosk-enter" />
      </button>
    </div>
    @if (asideToggle(); as toggle) {
      <!-- The page's side-panel toggle, at the right edge above the panel. -->
      <div class="aside-edge">
        <ng-template [cdkPortalOutlet]="toggle" />
      </div>
    }
  </header>
}

<main class="content">
  <ng-content />
</main>
