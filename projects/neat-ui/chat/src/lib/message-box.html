<div
  #frame
  class="frame"
  [attr.data-dragging]="dragging() ? '' : null"
  (dragover)="onDragOver($event)"
  (dragleave)="dragging.set(false)"
  (drop)="onDrop($event)"
>
  @if (glow() === 'steady-comet') {
    <!-- The steady comet: its tail's dashes along the edge, sharp and blurred, under the card. -->
    <div #comet class="comet" aria-hidden="true">
      <svg class="edge">
        @for (segment of cometSegments; track $index) {
          <rect
            [attr.pathLength]="cometPath"
            [attr.stroke-dasharray]="segment.dasharray"
            [style.stroke]="segment.stroke"
          />
        }
      </svg>
      <svg class="halo">
        @for (segment of cometSegments; track $index) {
          <rect
            [attr.pathLength]="cometPath"
            [attr.stroke-dasharray]="segment.dasharray"
            [style.stroke]="segment.stroke"
          />
        }
      </svg>
    </div>
  }
  <div class="inner">
    @if (pictures().length) {
      <ul class="thumbs" aria-label="Pictures">
        @for (picture of pictures(); track picture.id) {
          <li class="thumb">
            <img [src]="picture.src" [alt]="picture.name" />
            <button
              neatButton
              variant="secondary"
              size="small"
              iconOnly
              rounded
              type="button"
              class="remove"
              [attr.aria-label]="'Remove ' + picture.name"
              (click)="remove(picture)"
            >
              <neat-icon name="close" />
            </button>
          </li>
        }
      </ul>
    }
    <div class="text-box">
      <textarea
        #area
        class="text"
        [class.listening]="wave()"
        rows="1"
        [id]="id + '-text'"
        [attr.aria-label]="label()"
        [placeholder]="placeholder()"
        [value]="text()"
        [disabled]="disabled()"
        (input)="onInput(area)"
        (keydown)="onKeydown($event)"
      ></textarea>
      @if (wave()) {
        <canvas class="listening" aria-hidden="true"></canvas>
      }
    </div>
    <div class="row">
      <button
        neatButton
        variant="text"
        size="small"
        type="button"
        [attr.aria-disabled]="disabled() ? 'true' : null"
        (click)="disabled() || files.click()"
      >
        <neat-icon name="picture" />
        Picture
      </button>
      @if (camera()) {
        <button
          neatButton
          variant="text"
          size="small"
          type="button"
          [attr.aria-disabled]="cameraWaits() ? 'true' : null"
          (click)="openCamera()"
        >
          <neat-icon name="camera" />
          Camera
        </button>
      }
      <input
        #files
        type="file"
        accept="image/*"
        multiple
        hidden
        tabindex="-1"
        (change)="onFiles(files)"
      />
      <span class="note" role="status">{{ note() }}</span>
      @if (talk()) {
        <neat-push-to-talk
          data-in-box
          [listeningMotion]="listeningMotion()"
          [transcribing]="transcribing()"
          [disabled]="disabled()"
          [(recording)]="recording"
          (recorded)="onRecorded($event)"
        />
      }
      @if (speaking()) {
        <button
          #quietButton
          neatButton
          variant="secondary"
          iconOnly
          rounded
          type="button"
          class="quiet"
          aria-label="Stop reading aloud"
          neatTooltip="Stop reading aloud"
          (click)="quiet()"
        >
          <neat-icon name="voice-off" />
        </button>
      }
      <!--
        One button that is Send while idle and Stop while the board works: the focus stays on it as
        it changes, where swapping two buttons would drop it to the page.
      -->
      <button
        #act
        neatButton
        iconOnly
        rounded
        type="button"
        [variant]="idle() ? 'primary' : 'danger'"
        [class.send]="idle()"
        [class.stop]="!idle()"
        [attr.aria-label]="idle() ? 'Send' : 'Stop'"
        [neatTooltip]="idle() ? 'Send' : 'Stop'"
        [attr.aria-disabled]="idle() && !sendable() ? 'true' : null"
        (click)="idle() ? sendDraft() : stop.emit()"
      >
        <neat-icon [name]="idle() ? 'send' : 'stop'" />
      </button>
    </div>
  </div>
</div>
