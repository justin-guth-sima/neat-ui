<div class="box">
  <neat-file-browser
    rootLabel="Media Root"
    filterPlaceholder="Filter files…"
    [root]="tree"
    [(folder)]="folder"
    [(selected)]="selected"
  />
</div>
<p class="showcase-code showcase-muted" aria-live="polite">
  Picked: {{ selected() ?? 'none' }} (in /{{ folder() }})
</p>
