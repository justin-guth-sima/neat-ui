<div class="grid">
  <neat-chart-card
    heading="CPU usage"
    value="34"
    unit="%"
    caption="All cores"
    selectable
    [selected]="chosen() === 'cpu'"
    (activate)="chosen.set('cpu')"
  >
    <neat-time-chart
      label="CPU usage"
      headless
      [valueLabels]="false"
      [series]="cpu"
      [times]="times"
      [domain]="[0, 100]"
      [thresholds]="thresholds"
      [format]="percent"
    />
  </neat-chart-card>
  <neat-chart-card
    heading="MLA temperature"
    value="78.2"
    unit="°C"
    caption="Hottest of 8 sensors"
    selectable
    [selected]="chosen() === 'mla'"
    (activate)="chosen.set('mla')"
  >
    <neat-status-chip neatChartCardChip tone="warning">Warning</neat-status-chip>
    <neat-sparkline
      label="MLA temperature"
      tone="warning"
      [values]="temperature"
      [format]="celsius"
    />
  </neat-chart-card>
  <neat-chart-card
    heading="Fan speed"
    value="Not reported"
    caption="The board does not report it"
    selectable
    [selected]="chosen() === 'fan'"
    (activate)="chosen.set('fan')"
  />
  <neat-chart-card heading="Board power" value="11.4" unit="W" caption="Now" />
</div>
<p class="chosen showcase-code showcase-muted">Chosen: {{ chosen() }}</p>
