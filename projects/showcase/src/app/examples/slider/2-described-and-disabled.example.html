<div class="field">
  <span>Described</span>
  <neat-slider
    label="Gain"
    describedBy="gain-note"
    [min]="0"
    [max]="100"
    [step]="5"
    [(value)]="gain"
  />
  <span id="gain-note" class="showcase-muted"> <code>describedBy</code> names this note. </span>
</div>
<div class="field">
  <span>Disabled</span>
  <neat-slider label="Disabled" [min]="0" [max]="100" [step]="5" [value]="40" disabled />
</div>
