<div class="showcase-row">
  <span [neatStale]="stale()">12.4 fps · 3 objects</span>
  @if (stale()) {
    <span class="showcase-muted">Connection lost</span>
  }
  <button
    neatButton
    type="button"
    variant="outlined"
    size="small"
    [pressed]="stale()"
    (click)="stale.set(!stale())"
  >
    Stale
  </button>
</div>
