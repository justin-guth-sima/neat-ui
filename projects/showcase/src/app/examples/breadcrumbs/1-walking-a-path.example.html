<div class="card">
  <neat-breadcrumbs label="Example path" [crumbs]="path()" (go)="depth.set($event + 1)" />
  <p neatNote>
    <button
      neatInlineButton
      type="button"
      [disabled]="depth() === places.length"
      (click)="depth.set(depth() + 1)"
    >
      Deeper
    </button>
  </p>
</div>
