<div class="showcase-section">
  @for (motion of motions; track motion) {
    <p class="showcase-muted">
      {{
        motion === 'step' ? 'Step: moves when the app updates' : 'Smooth: scrolls between updates'
      }}
    </p>
    <neat-label-timeline
      [label]="'Last 30 s, ' + motion"
      [runs]="runs()"
      [nowMs]="nowMs()"
      [windowMs]="windowMs"
      [labels]="labels"
      [quiet]="quiet"
      [motion]="motion"
    />
  }
</div>
