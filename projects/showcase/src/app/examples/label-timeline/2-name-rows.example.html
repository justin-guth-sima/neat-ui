<div class="showcase-section">
  @for (rows of rowCounts; track rows) {
    <p class="showcase-muted">{{ rows === 1 ? 'One row (the default)' : 'Two rows' }}</p>
    <neat-label-timeline
      [label]="'Last 30 s, ' + (rows === 1 ? 'one row' : 'two rows') + ' of names'"
      [runs]="runs"
      [nowMs]="nowMs"
      [windowMs]="windowMs"
      [labels]="labels"
      [quiet]="quiet"
      [labelRows]="rows"
    />
  }
</div>
