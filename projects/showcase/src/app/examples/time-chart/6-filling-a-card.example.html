<div class="chart-grid">
  <div class="chart-card">
    <neat-time-chart
      label="Ten cores"
      size="large"
      [series]="cores"
      [times]="times"
      [domain]="[0, 100]"
      [format]="percent"
    />
  </div>
  <div class="chart-card fill">
    <neat-time-chart
      label="MLA usage"
      headline="62%"
      size="fill"
      [series]="mla"
      [times]="times"
      [domain]="[0, 100]"
      [format]="percent"
    />
  </div>
</div>
