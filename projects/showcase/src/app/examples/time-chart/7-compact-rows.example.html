<div class="chart-card rows">
  @for (row of rows; track row.label) {
    <div class="row">
      <span>{{ row.label }}</span>
      <neat-time-chart
        [label]="row.label"
        size="compact"
        headless
        [series]="row.series"
        [times]="row.times"
        [domain]="[0, 100]"
        [format]="percent"
      />
      <span>{{ row.value }}</span>
    </div>
  }
</div>
