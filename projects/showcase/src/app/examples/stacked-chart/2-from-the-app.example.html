<div class="beside">
  <div class="card">
    <neat-stacked-chart
      label="Where the power goes"
      [series]="rails"
      [times]="times"
      [domain]="[0, 16]"
      [format]="watts"
      [(hovered)]="moment"
      (activated)="picked.set($event)"
    />
  </div>
  <div class="report">
    <dl>
      <dt>Hovered</dt>
      <dd>{{ momentText() }}</dd>
      <dt>Last click</dt>
      <dd>{{ pickedText() }}</dd>
    </dl>
    <div class="actions">
      <button
        neatButton
        type="button"
        size="small"
        variant="secondary"
        (click)="moment.set(times[30])"
      >
        Show 12:02
      </button>
      <button neatButton type="button" size="small" variant="outlined" (click)="moment.set(null)">
        Clear
      </button>
    </div>
  </div>
</div>
